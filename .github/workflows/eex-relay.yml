name: Relevé EEX intraday (vers le dépôt privé)

# Deux lancements par jour ; chaque lancement commence par la collecte ENTSO-E / RTE / OMIP (data/ de ce dépôt),
# puis tourne en continu (jusqu'à ~5 h 45)
# et relève EEX toutes les 15 minutes. Les prix sont écrits UNIQUEMENT dans le dépôt privé
# brief-energie-prive : rien n'est enregistré ni affiché dans ce dépôt public.
#
# Les lancements programmés de GitHub sont souvent retardés, voire sautés : on en prévoit plusieurs
# par créneau (matin avant 11 h UTC, après-midi ensuite). Le job « garde » ne laisse partir que le
# premier du créneau ; les suivants s'arrêtent tout de suite si un relevé du même créneau tourne
# déjà ou a réussi. Un lancement manuel compte comme un lancement normal.
on:
  schedule:
    - cron: "3 7 * * 1-5"    # 8 h 03 à Paris (hiver)
    - cron: "23 7 * * 1-5"   # secours
    - cron: "43 7 * * 1-5"   # secours
    - cron: "13 8 * * 1-5"   # secours
    - cron: "3 12 * * 1-5"   # 13 h 03 à Paris : prend le relais (attend la fin du premier s'il tourne encore)
    - cron: "33 12 * * 1-5"  # secours
    - cron: "3 13 * * 1-5"   # secours
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  garde:
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.check.outputs.lancer }}
    steps:
      - name: Un relevé de ce créneau existe-t-il déjà ?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ $(date -u +%H) -lt 11 ]; then slot=matin; else slot=apres-midi; fi
          others=$(gh api "repos/${{ github.repository }}/actions/workflows/eex-relay.yml/runs?created=$today&per_page=50" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})
                   | select(((.created_at[11:13] | tonumber) < 11) == (\"$slot\" == \"matin\"))
                   | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          echo "Créneau $slot, autres lancements actifs ou réussis : $others"
          if [ "$others" = "0" ]; then echo "lancer=true" >> "$GITHUB_OUTPUT"; else echo "lancer=false" >> "$GITHUB_OUTPUT"; fi

  releve:
    needs: garde
    if: needs.garde.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: eex-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Collecte ENTSO-E, RTE et OMIP (production de la veille complète)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
        run: |
          timeout 1500 python3 collect.py > data-run.log 2>&1 || true
          mkdir -p data && grep -E "^(OK|FAIL)|étapes" data-run.log > data/last-run.log || true
          git config user.name "brief-energie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "Données du $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push -q
      - uses: actions/checkout@v4
        with:
          repository: merouane7824-lgtm/brief-energie-prive
          token: ${{ secrets.PRIVE_TOKEN }}
          path: prive
      - name: Vérifier l'accès en écriture au dépôt privé
        working-directory: prive
        run: git push --dry-run origin HEAD:refs/heads/main
      - name: Vérifier l'accès à EEX
        working-directory: prive
        run: timeout 300 python3 tools/eex_live.py 2>&1 | grep -E "^(OK|FAIL)"; test ${PIPESTATUS[0]} -eq 0
      - name: Relevés toutes les 15 minutes jusqu'à 19 h (Paris, hiver)
        working-directory: prive
        run: |
          git config user.name "brief-energie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date -u +%s)
          stop=$(( start + 345*60 ))
          close=$(date -u -d "today 18:00" +%s)
          [ $close -lt $stop ] && stop=$close
          while [ $(date -u +%s) -lt $stop ]; do
            timeout 400 python3 tools/eex_live.py 2>&1 | grep -E "^(OK|FAIL)" || true
            git add data/eex_live.json
            if ! git diff --cached --quiet; then
              git commit -q -m "EEX $(date -u +%H:%MZ) [skip ci]"
              git pull -q --rebase origin main && git push -q origin main || echo "FAIL envoi"
            fi
            now=$(date -u +%s); next=$(( (now/900 + 1)*900 + 120 ))
            [ $next -ge $stop ] && break
            sleep $(( next - now ))
          done
          echo "Fin des relevés à $(date -u +%H:%MZ)"
