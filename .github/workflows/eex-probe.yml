name: Test flux EEX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Interroger le Market Data Hub EEX
        continue-on-error: true
        run: mkdir -p data && python3 tools/eex_probe4.py
      - name: Enregistrer le résultat
        if: always()
        run: |
          git config user.name "brief-energie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eex_probe*.json || true
          git diff --cached --quiet || git commit -m "Test flux EEX $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push
