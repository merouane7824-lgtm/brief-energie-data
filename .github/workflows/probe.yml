name: Sonde pages (ponctuel)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
      - run: |
          git config user.name "brief-energie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/debug
          git diff --cached --quiet || git commit -m "Sonde $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push
